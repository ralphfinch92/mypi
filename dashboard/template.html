<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyScreen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2rem 3rem;
      text-align: center;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline { font-size: 0.9rem; opacity: 0.7; margin-bottom: 2rem; }
    .time {
      font-size: 4rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      margin: 1rem 0;
      color: #00ff88;
    }
    .date { font-size: 1.2rem; opacity: 0.9; margin-bottom: 2rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      text-align: left;
    }
    .item { padding: 0.75rem 1rem; background: rgba(0,0,0,0.2); border-radius: 8px; }
    .label { font-size: 0.75rem; text-transform: uppercase; opacity: 0.6; }
    .value { font-size: 1.1rem; font-weight: 600; margin-top: 0.25rem; }
    .footer { margin-top: 2rem; font-size: 0.85rem; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MYSCREEN</h1>
    <p class="tagline">Raspberry Pi display</p>
    <div class="time" id="time">--:--:--</div>
    <div class="date" id="date">--</div>
    <div class="grid">
      <div class="item"><div class="label">Hostname</div><div class="value" id="hostname">--</div></div>
      <div class="item"><div class="label">IP</div><div class="value" id="ip">--</div></div>
      <div class="item"><div class="label">Uptime</div><div class="value" id="uptime">--</div></div>
    </div>
    <p class="footer">Dashboard · Ready for Binance data</p>
  </div>
  <script>
    const hostnameEl = document.getElementById('hostname');
    const ipEl = document.getElementById('ip');
    const uptimeEl = document.getElementById('uptime');
    hostnameEl.textContent = '{{HOSTNAME}}';
    ipEl.textContent = '{{IP}}';
    uptimeEl.textContent = '{{UPTIME}}';
    function pad(n) { return String(n).padStart(2, '0'); }
    function updateTime() {
      const d = new Date();
      document.getElementById('time').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      document.getElementById('date').textContent = d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
